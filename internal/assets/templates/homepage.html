{{template "base" .}}
{{define "main"}}
  <div class="container">
    <table class="table table-striped text-center">
      <thead>
        <tr>
          <th scope="col">english</th>
          <th scope="col">russian</th>
        </tr>
      </thead>
      <tbody>
        {{range .Words}}
          <tr>
            <td>{{.English}}</td>
            <td>{{.Russian}}</td>
          </tr>
        {{end}}
      </tbody>
    </table>
  </div>
{{end}}
