on: [ push, pull_request ]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          command: fmt
          args: --diff

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          command: run
